# Builds the Flutter web app and deploys it to Vercel.
# - Pull requests: analyse + test only.
# - Pushes to main: analyse + test, then deploy to production
#   (https://jobsandmore.vercel.app).
#
# Required repository secrets:
#   VERCEL_TOKEN       – a Vercel access token (vercel.com/account/tokens)
#   VERCEL_ORG_ID      – from .vercel/project.json ("orgId")
#   VERCEL_PROJECT_ID  – from .vercel/project.json ("projectId")
name: Web – test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://jobsandmore.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set – skipping deploy."
            exit 0
          fi
          npx --yes vercel@66.2.0 deploy web-build --prod --yes --token "$VERCEL_TOKEN"
