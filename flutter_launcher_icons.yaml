# Generate with: dart run flutter_launcher_icons
# Source PNGs come from tool/render_brand_assets_test.dart (placeholder mark).
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B8457"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  min_sdk_android: 23
  # Web icons are rendered directly into web/icons/ by the tool script.
