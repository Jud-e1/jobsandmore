<!DOCTYPE html>
<html lang="en-NG">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by `flutter build web --base-href`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <title>JobsAndMore: jobs, careers and business support in Nigeria</title>
  <meta name="description" content="Find jobs across Nigeria, hire verified talent, build your career with AI tools and courses, and get support for your business.">
  <meta name="theme-color" content="#0E6B47" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1410" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph / social. Public listing pages get their own tags from the /seo Edge Function. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JobsAndMore">
  <meta property="og:title" content="JobsAndMore: jobs, careers and business support in Nigeria">
  <meta property="og:description" content="Find jobs across Nigeria, hire verified talent, build your career with AI tools and courses, and get support for your business.">
  <meta property="og:url" content="https://jobsandmoreng.com/">
  <meta property="og:image" content="https://jobsandmoreng.com/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JobsAndMore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="manifest" href="manifest.json">

  <!-- Warm up the font hosts so the first Flutter frame has its type sooner. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    html, body { margin: 0; height: 100%; background: #F5F5F7; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B1410; } }
  </style>
</head>
<body>
  <noscript>
    <p style="font-family:system-ui;padding:24px">JobsAndMore needs JavaScript to run. Please enable it in your browser settings.</p>
  </noscript>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
