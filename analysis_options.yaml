include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - lib/l10n/app_localizations*.dart
    - packages/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Doc comments on every public member add noise in app (non-package) code.
    public_member_api_docs: false
    # Formatter decides line breaks.
    lines_longer_than_80_chars: false
    # Package imports are used everywhere for consistency.
    always_use_package_imports: true
    prefer_relative_imports: false
    # Canvas painting reads better as one call per shape.
    cascade_invocations: false
