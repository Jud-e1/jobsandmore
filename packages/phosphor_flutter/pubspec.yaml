name: phosphor_flutter
description: Patched local copy of phosphor_flutter 2.1.0 for Flutter 3.47+ (icons as const IconData).
version: 2.1.0+jm.1
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: PhosphorBold
      fonts:
        - asset: lib/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: lib/fonts/Phosphor-Fill.ttf
    - family: PhosphorLight
      fonts:
        - asset: lib/fonts/Phosphor-Light.ttf
    - family: PhosphorThin
      fonts:
        - asset: lib/fonts/Phosphor-Thin.ttf
    - family: PhosphorRegular
      fonts:
        - asset: lib/fonts/Phosphor.ttf
