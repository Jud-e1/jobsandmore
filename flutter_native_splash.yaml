# Generate with: dart run flutter_native_splash:create
# Web is excluded (the web app has no splash screen by design).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash_mark.png
  color_dark: "#0B1220"
  image_dark: assets/brand/splash_mark.png

  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash_mark.png
    icon_background_color: "#FFFFFF"
    color_dark: "#0B1220"
    image_dark: assets/brand/splash_mark.png
    icon_background_color_dark: "#0B1220"

  web: false
  fullscreen: false
